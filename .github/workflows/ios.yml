name: iOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Maybe.xcodeproj \
            -scheme Maybe \
            -destination 'platform=iOS Simulator,name=iPhone 16e,OS=latest' \
            -derivedDataPath DerivedData \
            -resultBundlePath artifacts/MaybeTests.xcresult

      - name: Capture simulator screenshots
        run: |
          set -euo pipefail
          mkdir -p artifacts/screenshots

          SIMULATOR_UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next((d["udid"] for values in devices.values() for d in values), ""))')
          if [ -z "$SIMULATOR_UDID" ]; then
            SIMULATOR_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, values in devices.items() if "iOS-26" in runtime for d in values if d["name"] == "iPhone 16e"))')
            xcrun simctl boot "$SIMULATOR_UDID"
          fi

          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4

          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 2 -name Maybe.app -print -quit)
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

          xcrun simctl launch "$SIMULATOR_UDID" com.justpainful.Maybe
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot artifacts/screenshots/home.png

          xcrun simctl terminate "$SIMULATOR_UDID" com.justpainful.Maybe
          xcrun simctl launch "$SIMULATOR_UDID" com.justpainful.Maybe --show-add
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot artifacts/screenshots/add-sheet.png

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maybe-ios-ci
          path: artifacts
          if-no-files-found: warn
